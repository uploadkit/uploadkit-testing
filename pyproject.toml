[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uploadkit-testing"
version = "0.1.0"
description = "Testing utilities for UploadKit (fake providers, fixtures, assertions)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "UploadKit" }]
keywords = ["uploadkit", "testing", "fixtures"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "uploadkit>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "coverage>=7.0"]

[project.urls]
Homepage = "https://github.com/uploadkit/uploadkit-testing"
Repository = "https://github.com/uploadkit/uploadkit-testing"

[tool.hatch.build.targets.wheel]
packages = ["src/uploadkit_testing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
