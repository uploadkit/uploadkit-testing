name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout uploadkit-testing
        uses: actions/checkout@v4
        with:
          path: uploadkit-testing

      - name: Checkout uploadkit
        uses: actions/checkout@v4
        with:
          repository: uploadkit/uploadkit
          path: uploadkit

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install packages
        working-directory: uploadkit-testing
        run: |
          pip install -e ../uploadkit
          pip install -e ".[dev]"

      - name: Test
        working-directory: uploadkit-testing
        run: pytest -q

      - name: Coverage
        working-directory: uploadkit-testing
        run: |
          coverage run -m pytest -q
          coverage report -m --include='src/*' --fail-under=100
