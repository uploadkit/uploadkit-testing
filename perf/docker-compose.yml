services:
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  minio_init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      set -e;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/uploads;
      mc anonymous set none local/uploads;
      mc ls local/uploads;
      echo minio_ready;
      "

  api:
    build:
      context: ../..
      dockerfile: uploadkit-testing/perf/Dockerfile.api
    depends_on:
      minio:
        condition: service_healthy
      minio_init:
        condition: service_completed_successfully
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      UPLOAD_BUCKET: uploads
      UPLOAD_MAX_SIZE: "115343360"
      ASYNC_CHUNK_SIZE: "8388608"
      S3_PART_SIZE: ${S3_PART_SIZE:-5242880}
      ENABLE_CHECKSUM: ${ENABLE_CHECKSUM:-0}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-4}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  bench:
    profiles: ["bench"]
    build:
      context: ../..
      dockerfile: uploadkit-testing/perf/Dockerfile.bench
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE: http://api:8000
      ARTIFACTS_DIR: /artifacts
      K6_VUS_PNG: ${K6_VUS_PNG:-4}
      K6_ITER_PNG: ${K6_ITER_PNG:-20}
      K6_VUS_PDF: ${K6_VUS_PDF:-2}
      K6_ITER_PDF: ${K6_ITER_PDF:-5}
      PAYLOAD: ${PAYLOAD:-both}
      UPLOAD_ENDPOINT: ${UPLOAD_ENDPOINT:-both}
    volumes:
      - ./artifacts:/artifacts
      - ./scripts:/perf/scripts:ro
      - ./k6:/perf/k6:ro
